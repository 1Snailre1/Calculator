<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="calculator" id="calculator">
        
        
        <div class="top-panel">
            <div class="drag-handle" id="dragHandle"></div>
        </div>

        
        <div class="display" id="output">0</div>

        
        <div class="contain" id="calc">
            <button class="btn" value="%">%</button>
            <button class="btn" value="/">/</button>
            <button class="btn" value="*">*</button>
            <button class="btn" value="-">-</button>
            <button class="btn action" value="C">C</button>

            <button class="btn" value="7">7</button>
            <button class="btn" value="8">8</button>
            <button class="btn" value="9">9</button>
            <button class="btn plus" value="+">+</button>
            <button class="btn action" value="AC">AC</button>

            <button class="btn" value="4">4</button>
            <button class="btn" value="5">5</button>
            <button class="btn" value="6">6</button>
            <button class="btn" value="(">(</button>

            <button class="btn" value="1">1</button>
            <button class="btn" value="2">2</button>
            <button class="btn" value="3">3</button>
            <button class="btn equal" value="=">=</button>
            <button class="btn" value=")">)</button>

            <button class="btn zero" value="0">0</button>
            <button class="btn" value=".">.</button>
            <button class="btn" value="+/-">+/-</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
